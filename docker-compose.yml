services:
    api:
        build:
            context: ./api
            dockerfile: Dockerfile
        ports:
            - "8000:80"
        volumes:
            - ./api:/var/www/html
        depends_on:
            - mysql_db

    mysql_db:
        image: mysql:8.2
        environment:
            MYSQL_ROOT_USER: root
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: api_db
            MYSQL_USER: admin
            MYSQL_PASSWORD: admin
        ports:
            - 3306:3306
        volumes:
            - mysql_data:/var/lib/mysql

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        ports:
            - 3000:3000
        volumes:
            - ./frontend:/app
            - exclude:/app/node_modules/
        depends_on:
            - api

volumes:
  mysql_data:
  exclude: {}
